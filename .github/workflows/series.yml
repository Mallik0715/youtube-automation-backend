name: Story Series Upload

on:
  schedule:
    # Three parts a day, timed for a worldwide audience (YouTube's daily API quota allows ~6 uploads)
    - cron: '30 6 * * *'   # 06:30 UTC = 12:00 PM India, 7:30 AM UK, 2:30 AM New York
    - cron: '30 14 * * *'  # 14:30 UTC = 8:00 PM India, 3:30 PM UK, 10:30 AM New York
    - cron: '0 23 * * *'   # 23:00 UTC = 7:00 PM New York, 4:30 AM India (next day), 12:00 AM UK
  workflow_dispatch:

# Never run two uploads at once (they'd race on series_progress.json)
concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install edge-tts==7.3.1

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      # Backup voices, used only if edge-tts is unreachable. Never blocks the upload if it fails to install.
      - name: Install Kokoro backup voices
        continue-on-error: true
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install "kokoro>=0.9.4" soundfile

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Check series scripts
        run: npm run check:series

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render and upload next series part
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Optional: reads A/B votes from the previous part's comments (without it, a neutral opening is used)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # Up to 3 tries if the free voice service is down for a while. Progress is reset before each
        # retry so a failed try never skips a part.
        run: |
          for try in 1 2 3; do
            npm run series -- --upload && exit 0
            echo "Attempt $try failed - waiting 3 minutes before retrying"
            git checkout -- services/series_progress.json
            sleep 180
          done
          exit 1

      # Only runs if the upload succeeded, so a failed part is retried next time
      - name: Commit updated series progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/series_progress.json
          git diff --staged --quiet && exit 0
          git commit -m "Update series progress [skip ci]"
          git pull --rebase --autostash
          git push
