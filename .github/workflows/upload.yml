name: Daily YouTube Upload

on:
  schedule:
    # Timed for US viewers (most English Shorts traffic)
    - cron: '0 13 * * *'   # 9:00 AM ET  / 6:30 PM IST
    - cron: '0 18 * * *'   # 2:00 PM ET  / 11:30 PM IST
    - cron: '30 23 * * *'  # 7:30 PM ET  / 5:00 AM IST
  workflow_dispatch:

# Never run two uploads at once (they'd race on topic_progress.json)
concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install edge-tts

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run video pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: npm start

      # Only runs if the upload succeeded, so a failed topic is retried next time
      - name: Commit updated topic progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/topic_progress.json
          git diff --staged --quiet && exit 0
          git commit -m "Update topic progress [skip ci]"
          git pull --rebase
          git push
